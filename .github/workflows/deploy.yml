name: Deploy to Windows Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # NOTE: the runner OS is irrelevant — every command below runs on the
    # Windows Server over SSH (OpenSSH default shell = cmd.exe, NOT bash/PowerShell).
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # Full deploy (3x npm install incl. Puppeteer + CRA build) can take a
          # while on a Windows server — well above the action's 10m default.
          command_timeout: 30m
          script: |
            REM --- Go to project root ( /d also switches drive, e.g. D: ) ---
            cd /d "${{ secrets.PROJECT_PATH }}" || exit /b 1
            git pull || exit /b 1
            node --version
            call npm --version
            if not exist logs mkdir logs
            REM --- Install deps (mirrors root `npm run install-deps`: root + backend + frontend) ---
            REM `npm install`, NOT `npm ci`, because package-lock.json is gitignored.
            REM `call` is required so control returns after npm/pm2 (.cmd shims).
            call npm install --no-audit --no-fund || exit /b 1
            cd backend || exit /b 1
            call npm install --no-audit --no-fund || exit /b 1
            cd ..\frontend || exit /b 1
            if exist build rmdir /s /q build
            call npm install --no-audit --no-fund || exit /b 1
            call npm run build || exit /b 1
            if not exist build (echo ERROR: frontend build folder missing after build & exit /b 1)
            cd .. || exit /b 1
            REM --- Restart the consolidated backend (serves API + frontend/build) ---
            REM Canonical PM2 name is `ipc-system` from ecosystem.config.js (repo root).
            call pm2 restart ipc-system --update-env || call pm2 start ecosystem.config.js --env production || exit /b 1
            call pm2 save
            call pm2 list
            REM --- Smoke test: backend listens on PORT (ecosystem default 5000) ---
            timeout /t 15 /nobreak >nul
            curl.exe -f -s -o nul http://localhost:5000/ && echo SMOKE TEST OK || (call pm2 logs ipc-system --lines 30 --nostream & exit /b 1)
            echo Deployment completed successfully
