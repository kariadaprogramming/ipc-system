name: Deploy to Windows Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # NOTE: the runner OS is irrelevant — the command below runs on the
    # Windows Server over SSH (OpenSSH default shell = cmd.exe, NOT bash/PowerShell).
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # Full deploy can exceed the action's 10m default (3x npm install incl. Puppeteer + CRA build).
          command_timeout: 30m
          # Single-line cmd.exe chain (NOT PowerShell/bash). cmd.exe gotchas handled:
          # - `if` WITHOUT parentheses swallows the rest of the line (false condition
          #   silently skips everything AND exits 0), so every conditional is wrapped: (if ... )
          # - `timeout /t` fails over non-TTY SSH -> use `ping` as the sleep before the smoke test
          # - `call` before npm/pm2 so control returns (.cmd shims)
          # - `npm install`, NOT `npm ci` (package-lock.json is gitignored)
          # - backend/uploads and .env are gitignored and never touched
          # - PM2 app name is `ipc-system` from ecosystem.config.js (repo root)
          script: 'cd /d "${{ secrets.PROJECT_PATH }}" && git pull && node --version && call npm --version && (if not exist logs mkdir logs) && call npm install --no-audit --no-fund && cd backend && call npm install --no-audit --no-fund && cd ..\frontend && (if exist build rmdir /s /q build) && call npm install --no-audit --no-fund && call npm run build && dir build\index.html >nul 2>nul && cd .. && (call pm2 restart ipc-system --update-env || call pm2 start ecosystem.config.js --env production) && call pm2 save && call pm2 list && ping -n 16 127.0.0.1 >nul && curl.exe -f -s -o nul http://localhost:5000/ && echo SMOKE TEST OK && echo Deployment completed successfully'
